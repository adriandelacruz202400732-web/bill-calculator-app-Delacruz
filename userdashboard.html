<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>User Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  body.loading {
    background-color: #f5f5f5;
  }
  .loading-spinner {
    display: none;
    text-align: center;
    padding: 50px;
    font-size: 18px;
    color: #666;
  }
  body.loading .loading-spinner {
    display: block;
  }
  body.loading .container {
    display: none;
  }
</style>
</head>
<body class="loading">
<div class="loading-spinner">Loading...</div>

<div class="container">
  <h1>Welcome User</h1>
  <div class="card center">
    <a class="btn" href="calculatorpage.html">Calculate Now</a>
    <a class="btn" href="resultpage.html">View History</a>
    <a class="btn" href="profilepage.html">Profile</a>
  </div>
</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Configuration and Auth Functions -->
<script src="supabase.js"></script>

<script>
  // Protect page - check authentication
  async function protectPage() {
    const user = await initAuth();
    if (user) {
      // User authenticated, show content
      document.body.classList.remove('loading');
    }
  }

  protectPage();
</script>
</body>
</html>
